<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="RomaLearn">
  <title>RomaLearn</title>
  <!--
    Marca da RomaLearn: um arco romano com degraus subindo dentro dele.

    O arco é a porta de entrada (e o aceno ao nome). Os três degraus, que
    crescem da esquerda para a direita, são a trilha: o aluno atravessa a porta
    e continua subindo.

    Tudo é feito de formas cheias, sem traço fino. A parede tem 4 unidades e os
    vãos entre os degraus têm 2 — medidas escolhidas para que nada se cole a
    16px, que é o tamanho da aba do navegador.
  -->
  <defs>
    <linearGradient id="rl-arco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2543ea" />
      <stop offset="1" stop-color="#0d8571" />
    </linearGradient>
  </defs>

  <!-- Parede do arco: contorno externo menos o vão interno (evenodd). -->
  <path
    fill="url(#rl-arco)"
    fill-rule="evenodd"
    d="M4 27V17a12 12 0 0 1 24 0v10h-4V17a8 8 0 0 0-16 0v10z"
  />

  <!-- Degraus dentro do vão, apoiados na mesma linha de chão do arco. -->
  <g fill="url(#rl-arco)">
    <rect x="9.5" y="22" width="3" height="5" rx="1.1" />
    <rect x="14.5" y="18.5" width="3" height="8.5" rx="1.1" />
    <rect x="19.5" y="15" width="3" height="12" rx="1.1" />
  </g>
</svg>
