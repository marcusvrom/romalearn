name: romalearn

services:
  postgres:
    image: postgres:16-alpine
    container_name: romalearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-romalearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-romalearn}
      POSTGRES_DB: ${POSTGRES_DB:-romalearn}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-romalearn} -d ${POSTGRES_DB:-romalearn}']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: romalearn-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-romalearn}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-romalearn123}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket on first boot so the API can upload immediately.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: romalearn-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-romalearn} ${STORAGE_SECRET_KEY:-romalearn123} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-romalearn} &&
      mc anonymous set download local/${STORAGE_BUCKET:-romalearn}/public &&
      echo 'MinIO bucket pronto.'
      "

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: romalearn-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres-data:
  minio-data:
