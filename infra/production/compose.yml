name: romalearn-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - /opt/romalearn/secrets/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal

  api:
    image: ghcr.io/marcusvrom/romalearn-api:${APP_VERSION}
    restart: unless-stopped
    env_file:
      - /opt/romalearn/secrets/api.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3333/api/health/ready']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - internal
      - proxy

  web:
    image: ghcr.io/marcusvrom/romalearn-web:${APP_VERSION}
    restart: unless-stopped
    env_file:
      - /opt/romalearn/secrets/web.env
    environment:
      API_INTERNAL_URL: http://api:3333/api
      WEB_PORT: 4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:4000/']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - proxy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/healthz']
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - proxy

volumes:
  postgres-data:
  redis-data:

networks:
  internal:
    internal: true
  proxy:
