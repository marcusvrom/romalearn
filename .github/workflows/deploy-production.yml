name: Deploy Production

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

concurrency:
  group: romalearn-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-and-deploy:
    name: Publicar imagens e atualizar VPS
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    env:
      REGISTRY: ghcr.io
      API_IMAGE: ghcr.io/marcusvrom/romalearn-api
      WEB_IMAGE: ghcr.io/marcusvrom/romalearn-web
      VPS_HOST: 169.58.119.107

    steps:
      - name: Resolver versão validada
        id: version
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout da versão validada
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.sha }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.version.outputs.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: true
          sbom: true

      - name: Construir e publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.version.outputs.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: true
          sbom: true

      - name: Preparar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publicar configuração operacional na VPS
        env:
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/romalearn/config'
          scp -P "$PORT" infra/production/compose.yml "$VPS_USER@$VPS_HOST:/opt/romalearn/config/compose.yml"
          scp -P "$PORT" infra/production/nginx.conf "$VPS_USER@$VPS_HOST:/opt/romalearn/config/nginx.conf"
          scp -P "$PORT" infra/production/deploy.sh "$VPS_USER@$VPS_HOST:/opt/romalearn/deploy.sh"
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" 'chmod 750 /opt/romalearn/deploy.sh'

      - name: Executar deploy
        env:
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VERSION: ${{ steps.version.outputs.sha }}
        run: |
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" "/opt/romalearn/deploy.sh '$VERSION'"

      - name: Verificar produção
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -n "$PRODUCTION_URL" ]; then
            curl --fail --silent --show-error --retry 5 --retry-delay 5 \
              "$PRODUCTION_URL/api/health/ready"
          else
            curl --fail --silent --show-error --retry 5 --retry-delay 5 \
              "http://${VPS_HOST}/api/health/ready"
          fi
