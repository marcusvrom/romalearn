name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  quality:
    name: Formatação e lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # O repositório possui dívida de formatação anterior à implantação da CI.
      # Arquivos novos ou alterados continuam obrigatoriamente formatados.
      - name: Verificar formatação dos arquivos alterados
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            mapfile -t FILES < <(
              git ls-files | grep -E '\.(ts|html|scss|json|md)$' || true
            )
          else
            mapfile -t FILES < <(
              git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD |
                grep -E '\.(ts|html|scss|json|md)$' || true
            )
          fi

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "Nenhum arquivo suportado pelo Prettier foi alterado."
            exit 0
          fi

          printf 'Verificando formatação de:\n%s\n' "${FILES[*]}"
          pnpm exec prettier --check "${FILES[@]}"

      - name: Lint
        run: pnpm lint

      - name: Conferir ausência de arquivos .env
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.[^e]'; then
            echo "Arquivo .env encontrado no repositório."
            exit 1
          fi
          echo "Nenhum arquivo .env versionado."

  test-and-build:
    name: Testes e builds das aplicações
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: romalearn
          POSTGRES_PASSWORD: romalearn
          POSTGRES_DB: romalearn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U romalearn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Preparar banco de testes
        run: |
          PGPASSWORD=romalearn psql -h localhost -U romalearn -d romalearn \
            -c "CREATE DATABASE romalearn_test;"

      - name: Compilar contratos compartilhados
        run: pnpm --filter @romalearn/contracts build

      - name: Testes unitários
        run: pnpm --filter @romalearn/api test

      - name: Testes de integração e end-to-end
        run: pnpm --filter @romalearn/api test:e2e
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: romalearn
          POSTGRES_PASSWORD: romalearn
          POSTGRES_TEST_DB: romalearn_test

      - name: Build da API
        run: pnpm --filter @romalearn/api build

      - name: Build do frontend
        run: pnpm --filter @romalearn/web build

  container-build:
    name: Build Docker (${{ matrix.application }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: API
            dockerfile: apps/api/Dockerfile
            cache_scope: ci-api
            image_tag: romalearn-api:ci
          - application: frontend
            dockerfile: apps/web/Dockerfile
            cache_scope: ci-web
            image_tag: romalearn-web:ci

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: romalearn
          POSTGRES_PASSWORD: romalearn
          POSTGRES_DB: romalearn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U romalearn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem sem publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image_tag }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          provenance: false
          sbom: false

      - name: Validar migrations na imagem runtime da API
        if: matrix.application == 'API'
        run: |
          docker run --rm --network host \
            -e NODE_ENV=production \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=romalearn \
            -e POSTGRES_PASSWORD=romalearn \
            -e POSTGRES_DB=romalearn \
            "${{ matrix.image_tag }}" \
            pnpm migration:run:prod

          echo 'Executando novamente para confirmar que não há migrations pendentes...'
          docker run --rm --network host \
            -e NODE_ENV=production \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=romalearn \
            -e POSTGRES_PASSWORD=romalearn \
            -e POSTGRES_DB=romalearn \
            "${{ matrix.image_tag }}" \
            pnpm migration:run:prod
